<!DOCTYPE html>
<!--
  ODE TO THE OCEAN — sketchbook portfolio
  ================================================

  sånn funker d kort fortalt:
  boka er bygd i "ekte" 3d med css. hvert ark (en "leaf") er et fysisk
  ark med to sider: en forside og en bakside. arket henger fast i ryggen
  (midten av boka) og roterer rundt den når du blar - akkurat som en ekte
  bok. da ser du forsiden, så baksiden, og arket bak dukker fram.

  filer som må ligge i samme mappe:
    - sketchbook.html   (denne)
    - leather.png       (skinn-teksturen på coveret)
    - sea.png           (den svake havoverflate-teksturen i bakgrunnen)

  bla med knappene nederst, piltastene, eller lag dine egne triggere.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ode to the Ocean</title>

  <!-- ============================================================
       fonter
       vi henter "dancing script" fra google til den fine løkkeskrifta
       på coveret. resten er vanlig georgia (serif). hvis du er offline
       faller den bare tilbake til systemets cursive.
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     farger & variabler
     alt av farger bor her øverst sånn at d er lett å endre tema.
     bytt en verdi her, så oppdateres d overalt. */
  :root{
    --paper:      #efe9dc;   /* papirfargen på arkene (kremhvit) */
    --ink:        #2a2620;   /* vanlig tekstfarge */
    --ink-soft:   #7a7062;   /* svakere tekst (sidetall, plassholdere) */

    --ocean:      #178197;   /* knapp-farge */
    --ocean-hi:   #1fa0ba;   /* knapp når du hovrer */
    --ocean-bg:   #29b1c7;   /* bakgrunn - lys turkis (toppen) */
    --ocean-bg-2: #0e7284;   /* bakgrunn - dypere turkis (bunnen) */

    /* ---- fargen på havet (video-tinten) ----
       LETT Å ENDRE: bytt bare disse to. første tallene er R,G,B (fargen),
       siste tallet er styrken (0 = ingen farge, 1 = helt dekkende).
       toppen er lysere, bunnen mørkere. */
    --sea-tint-top:    rgba(41, 177, 199, 0.40);
    --sea-tint-bottom: rgba(14, 114, 132, 0.58);
  }

  /* liten reset så ting oppfører seg likt overalt */
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }

  /* ============================================================
     bakgrunnen (havet)
     en loopende havoverflate-video (sea.mp4) ligger bakerst, med et
     turkis tint-lag + litt blur oppå så d blir dus og ikke stjeler fokus
     fra boka. gradienten under er bare en fallback-farge hvis videoen
     ikke laster. alt midtstilles med flexbox. */
  body{
    font-family:"Georgia","Times New Roman",serif;
    background: radial-gradient(130% 120% at 50% 10%, var(--ocean-bg) 0%, var(--ocean-bg-2) 100%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }

  /* bakgrunnsvideoen ligger bakerst (z-index -2) og dekker hele skjermen.
     vi bruker TO video-lag som veksler: når det ene nærmer seg slutten
     starter det andre fra begynnelsen og fader inn OPPÅ det gamle - så
     loopen smelter sammen (morpher) i stedet for å hoppe/hakke. */
  #sea-bg{ position:fixed; inset:0; z-index:-2; }
  #sea-bg .sea-v{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    filter: blur(2px) saturate(1.05);
    opacity:0; transition: opacity 1.6s linear;   /* <- selve krysstoningen */
  }
  #sea-bg .sea-v.show{ opacity:1; }
  /* turkis tint oppå videoen - demper og gjør d mer ensfarget/rolig.
     fargen styres av variablene --sea-tint-top / --sea-tint-bottom lengst
     oppe, så d er lett å teste ulike farger uten å lete i koden. */
  #sea-tint{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(130% 120% at 50% 10%,
      var(--sea-tint-top) 0%, var(--sea-tint-bottom) 100%);
  }

  /* ============================================================
     scenen + selve boka (3d-oppsettet)
     #stage gir "perspektiv" - altså dybde. uten dette blir 3d-rotasjonen
     helt flat og kjedelig. jo høyere tall, jo mindre dramatisk vinkel. */
  #stage{
    perspective: 2700px;
    perspective-origin: 50% 50%;
    width: 100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* boka er to sider brei. den skaleres etter skjermbredden, men høyden
     får et tak sånn at den ikke blir høyere enn skjermen.
     aspect-ratio 2/1 = hver side blir en perfekt kvadrat (fint for photoshop!).
     preserve-3d er viktig: d lar barna (arkene) leve i ekte 3d-rom. */
  #book{
    position:relative;
    width: min(96vw, 1600px, 170vh);
    aspect-ratio: 2 / 1;
    transform-style: preserve-3d;
  }

  /* ============================================================
     skyggen bak boka
     bare et svakt, uskarpt mørkt felt bak boka så den ikke ser ut som
     den svever. den ligger der hele tida (popper ikke inn/ut) og er
     ganske gjennomsiktig så den ikke stjeler oppmerksomhet.
     translateZ(-1px) dytter den litt bakover så den havner bak arkene. */
  .bshadow{
    position:absolute; top:4%; bottom:0; left:2%; right:2%;
    background: rgba(4,28,36,.22);
    filter: blur(42px);
    transform: translateY(20px) translateZ(-1px);
    border-radius:20px; z-index:0; pointer-events:none;
  }

  /* ============================================================
     arket (leaf) - hjertet i hele greia
     et ark = ett fysisk blad med forside + bakside.
     venstre kant = ryggen (midten av boka), og arket roterer rundt den.
     transform-origin: left center = "hengsla" sitter på venstre kant.
     transition = den myke, litt trege vende-animasjonen. */
  .leaf{
    position:absolute;
    top:0; left:50%;
    width:50%; height:100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform .95s cubic-bezier(.3,.02,.2,1);
  }
  /* når js legger på klassen "flipped" svinger arket 180 grader til venstre */
  .leaf.flipped{ transform: rotateY(-180deg); }

  /* de to sidene av arket.
     backface-visibility:hidden er magien her - den skjuler baksida av et
     ansikt når d peker vekk fra deg. sånn ser du forsiden når arket ligger
     til høyre, og baksiden når d har vendt over til venstre.
     baksida roteres 180 grader så teksten ikke blir speilvendt. */
  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
    border-radius: 2px 12px 12px 2px;   /* runde ytterhjørner, skarpe mot ryggen */
  }
  .face.back{
    transform: rotateY(180deg);
    border-radius: 12px 2px 2px 12px;
  }

  /* ============================================================
     papir-siden (innholdet på et vanlig ark)
     kremhvit farge + en bitteliten svg-støy oppå så d ser ut som papir
     og ikke helt flatt/dødt. */
  .paper{
    position:absolute; inset:0;
    background-color: var(--paper);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/></svg>");
    color:var(--ink);
  }
  /* liten skygge inn mot ryggen (falsen) - gir følelse av at boka bøyer seg der */
  .face .paper{ box-shadow: inset 12px 0 24px -16px rgba(60,45,20,.32); }

  /* DINE EGNE ARK:
     sidene er tomt papir nå. for å legge inn et bilde bytter du bare ut
     <div class="paper"></div> inni riktig .face med:
        <img class="sheet-img" src="side01.png">
     lag kvadratiske bilder (1600x1600 px, evt 2000x2000 for retina) i full
     bleed - altså motiv helt ut til kanten. object-fit:cover strekker bildet
     så d dekker hele arket kant til kant. */
  .sheet-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ============================================================
     skinn-coveret
     ekte skinn-tekstur fra leather.png, pluss en svak lysglimt oppe til
     venstre og en indre skygge så d ser litt buet/ekte ut. */
  .cover{
    position:absolute; inset:0;
    background-color:#12151a;
    background-image:
      radial-gradient(120% 100% at 30% 15%, rgba(175,195,208,.28) 0%, rgba(0,0,0,0) 42%),
      url("leather.png");
    background-size: cover, cover;
    background-position:center;
    color:#c9c1b2;
    box-shadow: inset 0 0 70px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:40px;
  }
  /* "silver" = triks for å gjøre tekst til sølv: vi legger en sølv-gradient
     og klipper den til bokstavformene med background-clip:text. */
  .silver{
    background:linear-gradient(180deg,#fbfbfc 0%,#d9dde0 22%,#a7acb1 46%,#f0f2f4 56%,#9aa0a5 80%,#cdd2d6 100%);
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.55));
  }
  .cover-title{ line-height:1.1; padding:0 .35em; }
  .cover-title .ode{ display:block; font-family:"Dancing Script",cursive; font-weight:600; font-size:clamp(24px,4.4vw,40px); }
  .cover-title .ocean{ display:block; font-family:"Dancing Script",cursive; font-weight:700; font-size:clamp(52px,11.5vw,92px); margin-top:4px; padding:0 .12em; }
  .cover-by{ margin-top:26px; font-family:"Georgia",serif; font-size:clamp(11px,1.5vw,14px); letter-spacing:2.5px; opacity:.92; }

  /* ============================================================
     lys under vendinga + falsen
     .shade er et svart lag oppå hvert ansikt som er usynlig i ro, men
     mørkner litt midt i vendinga (når arket står på høykant). d gir en
     naturlig lys-effekt - som at mindre lys treffer arket når d står rett opp. */
  .shade{
    position:absolute; inset:0; background:#000; opacity:0; pointer-events:none;
    border-radius:inherit;
  }
  @keyframes flipShade{ 0%{opacity:0} 48%{opacity:.20} 52%{opacity:.20} 100%{opacity:0} }
  .leaf.animating .shade{ animation: flipShade .95s ease; }

  /* tynn skygge-strek midt i boka = ryggen/falsen når boka er åpen */
  #gutter{
    position:absolute; top:0; bottom:0; left:50%; width:40px; transform:translateX(-50%);
    background:linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(40,30,15,.10) 48%, rgba(40,30,15,.10) 52%, rgba(0,0,0,0) 100%);
    pointer-events:none; z-index:500;
  }

  /* ============================================================
     knappene (bla fram/tilbake)
     runde, turkis piller. de blir grå/disabla når du er på første/siste side. */
  #controls{ margin-top:26px; display:flex; gap:10px; }
  #controls button{
    font-family:inherit; font-size:13px; letter-spacing:1px; color:#f3fafc;
    background:var(--ocean); border:1px solid rgba(255,255,255,.18);
    padding:9px 18px; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.25);
    transition:background .15s ease, transform .05s ease;
  }
  #controls button:hover{ background:var(--ocean-hi); }
  #controls button:active{ transform:translateY(1px); }
  #controls button:disabled{ opacity:.4; cursor:default; }
</style>
</head>
<body>

  <!-- ============================================================
       bakgrunn: havoverflate-video
       muted + autoplay + loop + playsinline = spiller av automatisk og
       stille (nettlesere krever "muted" for å tillate autoplay).
       poster = stillbilde som vises mens videoen laster.

       VIL DU HA HAVLYD SEINERE? legg til under (og en liten knapp som
       starter den, siden nettlesere ikke tillater lyd av seg selv):
         <audio id="ocean" src="ocean.mp3" loop></audio>
       ============================================================ -->
  <div id="sea-bg">
    <video class="sea-v" muted playsinline preload="auto" poster="sea-poster.jpg"><source src="sea.mp4" type="video/mp4"></video>
    <video class="sea-v" muted playsinline preload="auto"><source src="sea.mp4" type="video/mp4"></video>
  </div>
  <div id="sea-tint"></div>

  <!-- ============================================================
       selve boka (html)
       hvert ARK er ett fysisk blad med to sider: .face front + .face back.
       sidene er tomt papir nå.

       SÅNN LEGGER DU INN ET ARK:
         bytt ut   <div class="paper"></div>   inni riktig .face med
         <img class="sheet-img" src="side01.png">

       (kvadratiske bilder, 1600x1600 px, full bleed. legg dem i samme mappe.)
       vil du ha flere sider? bare kopier et helt <div class="leaf">...</div>.
       ============================================================ -->
  <div id="stage">
    <div id="book">

      <!-- skygge bak boka + falsen i midten (ikke innhold, bare pynt) -->
      <div class="bshadow"></div>
      <div id="gutter"></div>

      <!-- ARK 0 :  front = coveret (skinn) / back = innsiden av forpermen -->
      <div class="leaf">
        <div class="face front">
          <div class="cover">
            <div class="cover-title silver">
              <span class="ode">ode to the</span>
              <span class="ocean">OCEAN</span>
            </div>
            <div class="cover-by silver">Art-Portfolio by Linn Thoresen</div>
          </div>
          <div class="shade"></div>
        </div>
        <div class="face back">
          <!-- innsiden av forpermen -->
          <div class="paper"></div>
          <div class="shade"></div>
        </div>
      </div>

      <!-- ARK 1 :  side 01  /  side 02 -->
      <div class="leaf">
        <div class="face front"><!-- side 01 --><div class="paper"></div><div class="shade"></div></div>
        <div class="face back"><!-- side 02 --><div class="paper"></div><div class="shade"></div></div>
      </div>

      <!-- ARK 2 :  side 03  /  side 04 -->
      <div class="leaf">
        <div class="face front"><!-- side 03 --><div class="paper"></div><div class="shade"></div></div>
        <div class="face back"><!-- side 04 --><div class="paper"></div><div class="shade"></div></div>
      </div>

      <!-- ARK 3 :  side 05  /  side 06 -->
      <div class="leaf">
        <div class="face front"><!-- side 05 --><div class="paper"></div><div class="shade"></div></div>
        <div class="face back"><!-- side 06 --><div class="paper"></div><div class="shade"></div></div>
      </div>

      <!-- ARK 4 :  side 07  /  side 08 -->
      <div class="leaf">
        <div class="face front"><!-- side 07 --><div class="paper"></div><div class="shade"></div></div>
        <div class="face back"><!-- side 08 --><div class="paper"></div><div class="shade"></div></div>
      </div>

      <!-- ARK 5 :  innsiden av bakpermen  /  coveret bak (skinn) -->
      <div class="leaf">
        <div class="face front"><!-- innsiden av bakpermen --><div class="paper"></div><div class="shade"></div></div>
        <div class="face back">
          <div class="cover"></div>
          <div class="shade"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- bla-knappene -->
  <div id="controls">
    <button id="prev">‹ Prev</button>
    <button id="next">Next ›</button>
  </div>

<script>
  /* ============================================================
     bla-logikken (js)
     ideen: "current" teller hvor mange ark som er vendt over til venstre.
     0 = boka er lukket. N = alle ark vendt (bakpermen synlig).
     resten handler egt bare om å legge arkene i riktig rekkefølge (z-index)
     så d øverste alltid er det du ser. */

  const leaves  = [...document.querySelectorAll('.leaf')];
  const N       = leaves.length;
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  let current = 0;      // hvor mange ark som er vendt til venstre
  let busy    = false;  // "opptatt" - hindrer at du blar midt i en animasjon

  /* legger arkene i riktig lag-rekkefølge.
     vendte ark stables til venstre (seinest vendt øverst), uvendte til
     høyre (tidligst øverst, så nåværende forside er den du ser).
     slår også knappene av/på når du er på første/siste side. */
  function applyZ(){
    leaves.forEach((lf, i) => {
      lf.style.zIndex = (i < current) ? (100 + i) : (100 + (N - i));
    });
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= N;
  }
  applyZ();

  /* selve vendinga. forward=true blar framover, false blar tilbake. */
  function flip(forward){
    if (busy) return;                         // ikke bla midt i en annen vending
    if (forward && current >= N) return;      // alt lengst fram allerede
    if (!forward && current <= 0) return;     // alt lengst tilbake allerede
    busy = true;

    // hvilket ark skal vi vende? framover = det neste, tilbake = det forrige
    const idx = forward ? current : current - 1;
    const lf  = leaves[idx];

    lf.style.zIndex = 999;         // hold arket øverst gjennom hele svingen
    lf.classList.add('animating'); // trigger lys-effekten (.shade)

    if (forward){ lf.classList.add('flipped');    current++; }
    else        { lf.classList.remove('flipped'); current--; }

    // når rotasjonen er ferdig: rydd opp og sett riktig z-index igjen
    const done = (e) => {
      if (e.propertyName !== 'transform') return;   // vent på riktig animasjon
      lf.classList.remove('animating');
      lf.removeEventListener('transitionend', done);
      applyZ();
      busy = false;
    };
    lf.addEventListener('transitionend', done);
  }

  // koble knappene og piltastene til vendinga
  nextBtn.onclick = () => flip(true);
  prevBtn.onclick = () => flip(false);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') flip(true);
    if (e.key === 'ArrowLeft')  flip(false);
  });

  /* ---- bakgrunnsvideo: sømløs loop med to lag som krysstoner ----
     to like videoer veksler. når den aktive nærmer seg slutten starter
     den andre fra 0 og fader inn oppå, så overgangen morpher i stedet for
     å hoppe. begge spiller samtidig gjennom hele krysstoningen.
     LETT Å ENDRE:
       RATE = fart (0.6 = roligere, 1 = normal)
       XF   = lengden på krysstoningen i sekunder
              (må matche "transition: opacity ...s" i css over) */
  const RATE = 0.6;
  const XF   = 1.6;
  const vids = [...document.querySelectorAll('#sea-bg .sea-v')];

  vids.forEach(v => { v.muted = true; v.playbackRate = RATE; });

  function run(v, other){
    v.currentTime = 0;
    v.classList.add('show');                 // det nye laget fader inn
    if (other) other.classList.remove('show'); // det gamle fader ut under
    v.play().catch(()=>{});

    // når vi nærmer oss slutten: start det andre laget (ping-pong)
    const onTick = () => {
      if (v.duration && v.currentTime >= v.duration - XF * RATE) {
        v.removeEventListener('timeupdate', onTick);
        run(other, v);
      }
    };
    v.addEventListener('timeupdate', onTick);
  }

  if (vids.length === 2) run(vids[0], vids[1]);
</script>
</body>
</html>
